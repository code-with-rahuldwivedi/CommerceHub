spring:
  datasource:
    # Harmless placeholders; the h2 profile or Testcontainers' @ServiceConnection take over.
    url: jdbc:mysql://placeholder:3306/placeholder
    username: placeholder
    password: placeholder
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    enabled: false

security:
  jwt:
    # replaced at runtime by the embedded JWKS server (see ApiTestSupport)
    jwks-uri: http://localhost:1/.well-known/jwks.json
    issuer: test-issuer
    audience: shopsphere-api
