
global:

  scrape_interval: 15s

  evaluation_interval: 15s



rule_files:

  - /etc/prometheus/alerts.yml



scrape_configs:

  - job_name: shopsphere

    metrics_path: /actuator/prometheus

    static_configs:

      - targets:

          - cloud-gateway:8080

          - service-registry:8761

          - user-service:8081

          - product-service:8082

          - order-service:8083

          - inventory-service:8084

