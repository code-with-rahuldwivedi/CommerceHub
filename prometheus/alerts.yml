
groups:

  - name: shopsphere-availability

    rules:

      - alert: ShopSphereServiceDown

        expr: up{job="shopsphere"} == 0

        for: 2m

        labels:

          severity: critical

        annotations:

          summary: "ShopSphere service is unavailable"

          description: "Prometheus cannot scrape {{ $labels.instance }} for at least 2 minutes."



      - alert: ShopSphereHighServerErrorRate

        expr: |

          (sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))

          / clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001)) > 0.05

        for: 5m

        labels:

          severity: warning

        annotations:

          summary: "High HTTP 5xx rate in {{ $labels.application }}"

          description: "More than 5% of HTTP requests returned 5xx for 5 minutes."

