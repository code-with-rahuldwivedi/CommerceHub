spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 1500000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    execution:
      thread-name-prefix: app-async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500

  # SMTP is configured ONLY through environment variables.
  # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
  # SPRING_MAIL_PASSWORD, etc.

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 10s
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

jwt:
  # PKCS#8 private key, PEM or single-line Base64 DER.
  private-key: ${JWT_PRIVATE_KEY:}
  previous-public-keys: ${JWT_PREVIOUS_PUBLIC_KEYS:}
  allow-ephemeral-key: ${JWT_ALLOW_EPHEMERAL_KEY:false}
  issuer: ${JWT_ISSUER:shopsphere-user-service}
  audience: ${JWT_AUDIENCE:shopsphere-api}
  access-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh-ttl: ${JWT_REFRESH_TTL:P7D}

app:
  lockout:
    max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
    lock-duration: ${LOCKOUT_DURATION:PT15M}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:20}

  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Administrator}

  account:
    require-email-verification: ${EMAIL_VERIFICATION_REQUIRED:false}
    verification-ttl: PT24H
    password-reset-ttl: PT30M
    resend-cooldown: PT1M

    # Direct User Service URLs for local testing.
    # {token} is replaced by MailService.
    verify-url: ${APP_VERIFY_URL:http://localhost:8081/api/auth/verify-email?token={token}}
    reset-url: ${APP_RESET_URL:http://localhost:8081/api/auth/reset-password?token={token}}

  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    log-only: ${MAIL_LOG_ONLY:false}

  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:365}

  request:
    max-body-bytes: 16384

  jobs:
    purge-cron: ${PURGE_CRON:0 30 3 * * *}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.shopsphere.userservice: INFO
