spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsphere_user_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springframework.security=WARN
logging.level.com.shopsphere.userservice=WARN
logging.level.org.hibernate.SQL=WARN

management.tracing.enabled=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name:user-service}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
