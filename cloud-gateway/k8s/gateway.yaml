# Example production manifests. Adjust image, hostnames, secret names and the trusted-proxy range.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  JWT_JWKS_URI: "http://user-service:8081/.well-known/jwks.json"
  CORS_ALLOWED_ORIGINS: "https://shop.example.com"
  # regex of your ingress / load balancer pod range (only these may set X-Forwarded-For)
  SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: "10\\.0\\.\\d{1,3}\\.\\d{1,3}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api-gateway }
      containers:
        - name: gateway
          image: registry.example.com/shopsphere/cloud-gateway:0.0.1
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8090 }
          envFrom:
            - configMapRef: { name: api-gateway-config }
          env:
            - name: EUREKA_DEFAULT_ZONE
              valueFrom:
                secretKeyRef: { name: api-gateway-secrets, key: eureka-default-zone }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }   # let the load balancer drain before Spring's graceful shutdown starts
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }   # expose ONLY this port through the ingress
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: api-gateway }
