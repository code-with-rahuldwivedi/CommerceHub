# Local development: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Needs user-service on :8081 (JWKS). Eureka is optional: without it, point the routes at fixed URLs.
security:
  jwt:
    jwks-uri: http://localhost:8081/.well-known/jwks.json
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
gateway:
  cors:
    allowed-origins: http://localhost:3000
  rate-limit:
    auth-per-minute: 60
