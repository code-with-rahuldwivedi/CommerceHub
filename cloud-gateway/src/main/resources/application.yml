server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # User Service
            - id: USER-SERVICE
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/user/**,/api/admin/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: USER-SERVICE
                    fallbackUri: forward:/userServiceFallBack

            # Product Service
            - id: PRODUCT-SERVICE
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/createProduct,/api/getAllProducts,/api/product/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: PRODUCT-SERVICE
                    fallbackUri: forward:/productServiceFallBack

            # Order Service
            - id: ORDER-SERVICE
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: ORDER-SERVICE
                    fallbackUri: forward:/orderServiceFallBack

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    enabled: false
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    instances:
      USER-SERVICE:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

      PRODUCT-SERVICE:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

      ORDER-SERVICE:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  timelimiter:
    instances:
      USER-SERVICE:
        timeoutDuration: 4s

      PRODUCT-SERVICE:
        timeoutDuration: 4s

      ORDER-SERVICE:
        timeoutDuration: 4s

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.security: WARN
    com.shopsphere.cloud: INFO
