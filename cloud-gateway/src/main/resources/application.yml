# Required environment (the gateway refuses to start without them):
#   JWT_JWKS_URI          e.g. http://user-service:8081/.well-known/jwks.json
#   EUREKA_DEFAULT_ZONE   e.g. http://user:pass@service-registry:8761/eureka/
# For local development use: --spring.profiles.active=local

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      server:
        webmvc:
          # Timeouts of the proxied call. Keep READ above the slowest circuit-breaker timeout below.
          http-client:
            connect-timeout: 2s
            read-timeout: 15s
          # Routes are matched top to bottom: the most specific path first.
          routes:
            # ---- Order service: customer API and back office ----
            - id: order-admin
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/admin/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: order-service
                    fallbackUri: forward:/fallback/order-service
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders,/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: order-service
                    fallbackUri: forward:/fallback/order-service

            # ---- User service: authentication, profile, user administration ----
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/user/**,/api/admin/users,/api/admin/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: user-service
                    fallbackUri: forward:/fallback/user-service

            # ---- Product service: current REST API + deprecated RPC-style aliases ----
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products,/api/products/**,/api/product/**,/api/getAllProducts,/api/createProduct
              filters:
                - name: CircuitBreaker
                  args:
                    id: product-service
                    fallbackUri: forward:/fallback/product-service

            # ---- Inventory service: admin reads / initialisation only (reduce/restore are blocked in SecurityConfig) ----
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory,/api/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: inventory-service
                    fallbackUri: forward:/fallback/inventory-service

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  # Behind a load balancer / ingress: resolve the real client IP (rate limiting depends on it).
  # Only trusted proxies may set X-Forwarded-For. Tomcat trusts private ranges by default; narrow it to your
  # LB / ingress range with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex) in production.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    connection-timeout: 10s
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
    accept-count: 200
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    registry-fetch-interval-seconds: 10
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Access tokens are issued by user-service (RS256) and verified here with its public keys.
security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI}
    issuer: ${JWT_ISSUER:shopsphere-user-service}
    audience: ${JWT_AUDIENCE:shopsphere-api}
    connect-timeout: PT2S
    read-timeout: PT3S

gateway:
  cors:
    # Comma separated exact origins, e.g. https://shop.example.com . Empty = no cross-origin browser access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:20}          # POST /api/auth/** per client IP
    anonymous-per-minute: ${RATE_LIMIT_ANON_PER_MIN:120}    # public reads per client IP
    user-per-minute: ${RATE_LIMIT_USER_PER_MIN:300}         # signed-in requests per user
    max-keys: 200000
  request:
    max-body-bytes: ${MAX_BODY_BYTES:32768}
    reject-chunked: ${REJECT_CHUNKED:true}
  resilience:
    window-size: 20
    minimum-calls: 10
    failure-rate-percent: 50
    open-duration: PT15S
    default-timeout: PT5S
    timeouts:
      # order placement calls product-service (with retries) before it answers
      order-service: PT12S

management:
  # Actuator lives on its own port, which must NOT be published by the load balancer / ingress.
  server:
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.shopsphere.cloud: INFO
    ACCESS: INFO
    org.springframework.security: WARN
