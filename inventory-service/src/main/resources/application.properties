spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere_inventory_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.springframework.security=DEBUG
logging.level.com.shopsphere.inventoryservice=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
inventory.kafka.result-topic=inventory-events
inventory.kafka.order-topic=order-events

logging.level.org.hibernate.SQL=WARN

jwt.secret=${JWT_SECRET}
service.auth.token=${INVENTORY_SERVICE_TOKEN}