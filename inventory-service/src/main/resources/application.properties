spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopsphere_inventory_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.listener.ack-mode=record
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:inventory-service-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
inventory.kafka.result-topic=${INVENTORY_RESULT_TOPIC:inventory-events}
inventory.kafka.order-topic=${ORDER_EVENTS_TOPIC:order-events}

logging.level.org.springframework.security=WARN
logging.level.com.shopsphere.inventoryservice=WARN
logging.level.org.hibernate.SQL=WARN

jwt.secret=${JWT_SECRET}
service.auth.token=${INVENTORY_SERVICE_TOKEN}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name:inventory-service}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.enabled=${TRACING_ENABLED:false}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
